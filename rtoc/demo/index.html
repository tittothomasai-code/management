<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steve's RTOC — test-only WITSML context</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body>
<header>
  <h1>Steve's RTOC</h1>
  <div class="banner" id="banner">SIM-TEST synthetic fixture. Not live rig data. Not a completeness claim.</div>
  <div class="row">
    <label>Well <select id="well"></select></label>
    <label>Wellbore <select id="wb"></select></label>
    <button type="button" id="hide">Hide well pane</button>
    <button type="button" id="prev">Previous joint</button>
    <button type="button" id="next">Next joint</button>
    <button type="button" id="current">Current joint</button>
    <button type="button" id="live">Append test sample</button>
  </div>
  <div class="meta" id="meta"></div>
</header>
<div id="app">
  <section id="wellPane"></section>
  <div id="gutter" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>
  <section id="joint"></section>
</div>
<script type="module" src="./demo.js"></script>
</body>
</html>
