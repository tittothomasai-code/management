plugins = []
redirects = []

# ES modules must be served as JavaScript (strict MIME check for module scripts).
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[functions]

  [functions."*"]

[build]

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]