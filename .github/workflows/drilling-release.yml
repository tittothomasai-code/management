name: Drilling release
on:
  push:
    branches: [release/drilling-live]
    paths: ['drilling/bha-builder/**', 'drilling/ops.html', 'drilling/opsnow.js', 'drilling/edmmap.js', 'drilling/edmui.js', 'drilling/edm_field_check.mjs', 'drilling/edm_field_check_core.mjs', 'drilling/edm_field_check_worker.mjs', 'drilling/opsnow_hardpoints.mjs', 'drilling/opsnow_operation_report.mjs', 'drilling/opsnow_measured_upload.mjs', 'drilling/opsnow_joint_metrics.mjs', 'drilling/opsnow_tallyview.js', 'drilling/opsnow_tally_compare.mjs', 'drilling/data/dr101l-wb04-measured-tally.json', 'drilling/opsnow_pumps.mjs', 'drilling/opsnow_pumps.css', 'drilling/opsnow_survey_alert.mjs', 'drilling/opsnow_survey_alert.css']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drilling-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build preview while preserving production inventory
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node .github/scripts/drilling-release.mjs preview
      - name: Install browser test runner
        run: npm ci --prefix drilling-tests
      - name: Unit and SIM regression checks
        env:
          PLAYWRIGHT_MODULE: playwright
        run: |
          npm test --prefix drilling-tests
          ROBOTYX_CHROMIUM_PATH=$(command -v google-chrome || command -v chromium) node drilling-tests/survey-alert-browser.mjs
          ROBOTYX_CHROMIUM_PATH=$(command -v google-chrome || command -v chromium) node drilling-tests/edm-field-browser.mjs
      - name: Test actual unpublished deploy
        run: ROBOTYX_CHROMIUM_PATH=$(command -v google-chrome || command -v chromium) node .github/scripts/drilling-acceptance.mjs
      - name: Publish verified preview and check production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node .github/scripts/drilling-release.mjs publish
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: drilling-release-evidence
          path: release-evidence/
          if-no-files-found: ignore
          retention-days: 7
