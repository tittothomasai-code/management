name: Sign auth host inspection
on:
  push:
    branches: [ops/RBX-2518-sign-auth-host]
    paths: [.github/scripts/sign-auth-host.mjs, .github/workflows/sign-auth-host.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect hosting configuration without displaying values
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node .github/scripts/sign-auth-host.mjs
